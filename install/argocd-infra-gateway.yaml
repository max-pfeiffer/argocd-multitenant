# The infrastructure control plane's front door. Applied by hand, after the LB pool exists.
# Deliberately a separate Gateway from both the tenant and multi-tenant ones (guardrail 19).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd-infra
  namespace: argocd-infra
spec:
  # Pinned with Gateway API's own `addresses` field, NOT an annotation. Cilium propagates no
  # annotations from a Gateway onto the LoadBalancer Service it generates, so
  # `io.cilium/lb-ipam-ips` here is silently inert and LB-IPAM hands out whatever is free — which
  # shuffles addresses under the DNS records on any re-create. Verify with:
  #   kubectl get gateway -A -o custom-columns=NAME:.metadata.name,ADDR:.status.addresses[*].value
  addresses:
    - type: IPAddress
      value: "192.168.20.245"
  gatewayClassName: cilium
  listeners:
    - name: argocd-infra-tls
      protocol: TLS
      port: 443
      hostname: argocd-infra-amt.lan
      tls:
        mode: Passthrough                 # argocd-server presents its own cert
      allowedRoutes:
        namespaces:
          from: Same                      # nothing outside argocd-multitenant may attach
        kinds:
          - kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1         # TLSRoute is v1 as of Gateway API v1.6.x — see install/argocd-gateway.yaml
kind: TLSRoute
metadata:
  name: argocd-infra-server
  namespace: argocd-infra
spec:
  parentRefs:
    - name: argocd-infra
      sectionName: argocd-infra-tls
  hostnames:
    - argocd-infra-amt.lan
  rules:
    - backendRefs:
        - name: argocd-infra-server
          port: 443
