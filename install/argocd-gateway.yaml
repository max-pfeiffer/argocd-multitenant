# The multi-tenant control plane's front door. Applied by hand, right after install/argocd-cr.yaml.
# Deliberately a separate Gateway from the tenant one (guardrail 19).
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: argocd
  namespace: argocd-multitenant
  annotations:
    io.cilium/lb-ipam-ips: "192.168.20.246"    # pinned; see the address allocation table in CLAUDE.md
spec:
  gatewayClassName: cilium
  listeners:
    - name: argocd-tls
      protocol: TLS
      port: 443
      hostname: argocd-amt.lan
      tls:
        mode: Passthrough                 # argocd-server presents its own cert
      allowedRoutes:
        namespaces:
          from: Same                      # nothing outside argocd-multitenant may attach
        kinds:
          - kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1         # TLSRoute is v1 as of Gateway API v1.6.x;
                                                 # v1alpha2 is no longer served (check with
                                                 # `kubectl get crd tlsroutes.gateway.networking.k8s.io -o yaml`)
kind: TLSRoute
metadata:
  name: argocd-server
  namespace: argocd-multitenant
spec:
  parentRefs:
    - name: argocd
      sectionName: argocd-tls
  hostnames:
    - argocd-amt.lan
  rules:
    - backendRefs:
        - name: argocd-server
          port: 443
