# The multi-tenant ArgoCD instance. Applied by hand as a platform admin (guardrail 19) —
# deliberately outside the path platform-root syncs.
#
# BOOTSTRAP NOTE: on a brand-new cluster, apply this first with spec.sourceNamespaces EMPTY.
# The operator errors reconciling a sourceNamespaces entry for a namespace that does not exist
# yet. Create the team namespaces, then re-apply with the list below. See Phase 9 of the runbook.
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd
  namespace: argocd-multitenant
spec:
  # Argo CD v3.3.10 — exactly the version operator v0.18.0 defaults to and is tested against,
  # so there is no operator/app version skew to reason about. Keep it that way: bump this only
  # together with a deliberate check of the operator's compatibility matrix.
  #
  # An exact release tag, not a digest. `spec.version` accepts either — the operator composes any
  # value containing ':' as `image@sha256:...` — and the digest for this tag is
  #   sha256:05d68bf224df7cd39713012c19226a33c374f2f3bd65df7b9088349e4ac3e6a2
  # which is byte-identical to what operator v0.18.0 hardcodes as its default. Swap the tag for
  # that digest if you want the stronger pin (guardrail 13); the tag is kept here for readability.
  version: v3.3.10
  resourceTrackingMethod: annotation        # required: multi-namespace app IDs are <namespace>/<name>
                                            #   and blow past the 63-char label-value limit
  disableAdmin: false                       # false only until OIDC is verified, then flip to true

  # Applications-in-any-namespace: exact team "-apps" namespaces only.
  # Never "*", never a glob ("team-*") or regex ("/^team-.*$/") — the operator expands both.
  sourceNamespaces:
    - team-a-apps
    - team-b-apps
    - team-c-apps

  oidcConfig: |
    name: Corp SSO
    issuer: https://keycloak-amt.lan/realms/platform
    clientID: argocd
    clientSecret: $argocd-oidc:clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    # Keycloak's certificate is issued by our own step-ca, which the argocd-server container's
    # default trust store knows nothing about. Without this, SSO login fails at the very first
    # step — argocd-server cannot fetch the issuer's discovery document — and the UI reports it
    # as a generic login error rather than a certificate problem.
    #
    # This is the PUBLIC root certificate, so committing it is fine (guardrail 12 is about key
    # material). It is the same cert as the caBundle in infra/pki/step-clusterissuer.yaml; if the
    # CA is ever rotated, both change together.
    #
    # Deliberately NOT `oidc.tls.insecure.skip.verify` — this exchange carries the client secret.
    rootCA: |
      -----BEGIN CERTIFICATE-----
      MIIBvzCCAWWgAwIBAgIQB5WVDHDi3ZoBzaRpuIbPWTAKBggqhkjOPQQDAjA+MRkw
      FwYDVQQKExBQbGF0Zm9ybSBSb290IENBMSEwHwYDVQQDExhQbGF0Zm9ybSBSb290
      IENBIFJvb3QgQ0EwHhcNMjYwODIzMTUyODU2WhcNMzYwODIwMTUyODU2WjA+MRkw
      FwYDVQQKExBQbGF0Zm9ybSBSb290IENBMSEwHwYDVQQDExhQbGF0Zm9ybSBSb290
      IENBIFJvb3QgQ0EwWTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAATCM7fy6BzdGlLs
      DO4iiP6D3Nku1aSOBr00BBF7Dd7YgvpyCkwuD1w2Z9cMnABgOFy4IPG2K925WSTK
      dmjdBvkjo0UwQzAOBgNVHQ8BAf8EBAMCAQYwEgYDVR0TAQH/BAgwBgEB/wIBATAd
      BgNVHQ4EFgQU8sb4cPdZnaw5YzK1//0el4PoHTIwCgYIKoZIzj0EAwIDSAAwRQIg
      GLZWIBu9JDKS1IlDCAckL//miMr3/+9kDYaCptr5T4gCIQCjRn2+nlk7WQ7kcovD
      JxUWJusFO4p8JNpAB7lJGQqdnQ==
      -----END CERTIFICATE-----

  rbac:
    defaultPolicy: ""                       # default-deny — never widen this
    scopes: "[groups]"
    policy: |
      p, role:platform-admin, applications, *, */*, allow
      p, role:platform-admin, projects, *, *, allow
      p, role:platform-admin, repositories, *, *, allow
      p, role:platform-admin, clusters, *, *, allow
      g, platform-admins, role:platform-admin

      p, role:team-a, applications, get, team-a/team-a-apps/*, allow
      p, role:team-a, applications, sync, team-a/team-a-apps/*, allow
      p, role:team-a, applications, action/*, team-a/team-a-apps/*, allow
      g, team-a-devs, role:team-a

      p, role:team-b, applications, get, team-b/team-b-apps/*, allow
      p, role:team-b, applications, sync, team-b/team-b-apps/*, allow
      p, role:team-b, applications, action/*, team-b/team-b-apps/*, allow
      g, team-b-devs, role:team-b

      p, role:team-c, applications, get, team-c/team-c-apps/*, allow
      p, role:team-c, applications, sync, team-c/team-c-apps/*, allow
      p, role:team-c, applications, action/*, team-c/team-c-apps/*, allow
      g, team-c-devs, role:team-c

  server:
    insecure: false                         # TLS terminates properly, no plaintext server mode
    replicas: 1
    host: argocd-amt.lan                # still set: the operator derives argocd-cm's `url` from it
    ingress:
      enabled: false                        # exposure is via Gateway API — see install/argocd-gateway.yaml
    # No `route:` block — that field is OpenShift-only (guardrail 22).

  controller:
    # There is no `spec.controller.replicas` in the v1beta1 CRD — the API server rejects it with
    # a strict-decoding error. One application controller is the default; scaling it out is
    # `spec.controller.sharding` (enabled + replicas/minShards/maxShards), not a replica count.
    sharding:
      enabled: false                        # flip on once one controller cannot keep up
  repo:
    replicas: 1
  ha:
    enabled: false                          # flip on once you outgrow a single redis replica
