# The infrastructure ArgoCD instance. Applied by hand as a platform admin, BEFORE the
# multi-tenant instance — it produces the StorageClass, LB addresses, certificate issuer
# and identity provider the other instance depends on.
#
# BOOTSTRAP NOTE: apply this first WITHOUT spec.oidcConfig — Keycloak does not exist yet.
# Reach the UI with: kubectl -n argocd-infra port-forward svc/argocd-infra-server 8080:443
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: argocd-infra
  namespace: argocd-infra
spec:
  # Argo CD v3.3.10 — MUST stay identical to install/argocd-cr.yaml. One operator reconciles both
  # instances; running them on different Argo CD versions is a debugging trap, not a feature.
  # See the pinning note in install/argocd-cr.yaml.
  version: v3.3.10
  resourceTrackingMethod: annotation
  disableAdmin: false                       # true once Keycloak exists and OIDC is verified

  sourceNamespaces: []                      # NONE. Applications live only in argocd-infra (guardrail 28)

  oidcConfig: |                             # added after Keycloak is up — see the bootstrap order
    name: Corp SSO
    issuer: https://keycloak-amt.lan/realms/platform
    clientID: argocd-infra
    clientSecret: $argocd-infra-oidc:clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    # Keycloak's certificate is issued by our own step-ca, which the argocd-server container's
    # default trust store knows nothing about. Without this, SSO login fails at the very first
    # step — argocd-server cannot fetch the issuer's discovery document — and the UI reports it
    # as a generic login error rather than a certificate problem.
    #
    # This is the PUBLIC root certificate, so committing it is fine (guardrail 12 is about key
    # material). It is the same cert as the caBundle in infra/pki/step-clusterissuer.yaml; if the
    # CA is ever rotated, both change together.
    #
    # Deliberately NOT `oidc.tls.insecure.skip.verify` — this exchange carries the client secret.
    rootCA: |
      -----BEGIN CERTIFICATE-----
      MIIBvzCCAWWgAwIBAgIQB5WVDHDi3ZoBzaRpuIbPWTAKBggqhkjOPQQDAjA+MRkw
      FwYDVQQKExBQbGF0Zm9ybSBSb290IENBMSEwHwYDVQQDExhQbGF0Zm9ybSBSb290
      IENBIFJvb3QgQ0EwHhcNMjYwODIzMTUyODU2WhcNMzYwODIwMTUyODU2WjA+MRkw
      FwYDVQQKExBQbGF0Zm9ybSBSb290IENBMSEwHwYDVQQDExhQbGF0Zm9ybSBSb290
      IENBIFJvb3QgQ0EwWTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAATCM7fy6BzdGlLs
      DO4iiP6D3Nku1aSOBr00BBF7Dd7YgvpyCkwuD1w2Z9cMnABgOFy4IPG2K925WSTK
      dmjdBvkjo0UwQzAOBgNVHQ8BAf8EBAMCAQYwEgYDVR0TAQH/BAgwBgEB/wIBATAd
      BgNVHQ4EFgQU8sb4cPdZnaw5YzK1//0el4PoHTIwCgYIKoZIzj0EAwIDSAAwRQIg
      GLZWIBu9JDKS1IlDCAckL//miMr3/+9kDYaCptr5T4gCIQCjRn2+nlk7WQ7kcovD
      JxUWJusFO4p8JNpAB7lJGQqdnQ==
      -----END CERTIFICATE-----

  rbac:
    defaultPolicy: ""                       # default-deny, same as the other instance
    scopes: "[groups]"
    policy: |
      p, role:infra-admin, applications, *, */*, allow
      p, role:infra-admin, projects, *, *, allow
      p, role:infra-admin, repositories, *, *, allow
      p, role:infra-admin, clusters, *, *, allow
      g, platform-admins, role:infra-admin
      # No team group appears here. Ever. (guardrail 29)

  server:
    insecure: false
    replicas: 1
    host: argocd-infra-amt.lan
    ingress:
      enabled: false                        # Gateway API, same as the other instance

  controller:
    # No `spec.controller.replicas` in the v1beta1 CRD — see the note in install/argocd-cr.yaml.
    sharding:
      enabled: false
  repo:
    replicas: 1
  ha:
    enabled: false
