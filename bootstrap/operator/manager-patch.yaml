# Verify the Deployment and container names against `kustomize build bootstrap/operator` before
# trusting this patch: a strategic-merge patch whose name does not match is a SILENT no-op, which
# here means an operator running with the wrong scope.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-operator-controller-manager
spec:
  template:
    spec:
      containers:
        - name: manager
          env:
            # Watch all namespaces. Nothing sets this for you: under OLM, the AllNamespaces
            # OperatorGroup injected WATCH_NAMESPACE="". Left at the pod's own namespace, the
            # operator quietly becomes namespace-scoped and never reconciles either ArgoCD CR.
            - name: WATCH_NAMESPACE
              value: ""
            - name: ARGOCD_CLUSTER_CONFIG_NAMESPACES
              value: argocd-infra,argocd-multitenant   # exactly these two — see guardrail 18
