# Matched by `target: {kind: Namespace}` in kustomization.yaml, not by the name below — the base
# renames this object twice (kubebuilder's `system` -> its own `namespace:` -> ours), so name
# matching here is unreliable. The name is kept only so the file reads as valid YAML in isolation.
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-operator
  labels:
    pod-security.kubernetes.io/enforce: baseline      # Talos' cluster default, pinned explicitly (guardrail 21)
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
