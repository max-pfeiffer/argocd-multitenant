apiVersion: v1
kind: Namespace
metadata:
  name: tenant-gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tenant
  namespace: tenant-gateway
spec:
  # Pinned with Gateway API's own `addresses` field, NOT an annotation. Cilium propagates no
  # annotations from a Gateway onto the LoadBalancer Service it generates, so
  # `io.cilium/lb-ipam-ips` here is silently inert and LB-IPAM hands out whatever is free — which
  # shuffles addresses under the DNS records on any re-create. Verify with:
  #   kubectl get gateway -A -o custom-columns=NAME:.metadata.name,ADDR:.status.addresses[*].value
  addresses:
    - type: IPAddress
      value: "192.168.20.247"
  gatewayClassName: cilium
  listeners:
    - name: team-a
      protocol: HTTPS
      port: 443
      hostname: "*.team-a-amt.lan"    # team-a can only ever claim names under its own subdomain
      tls:
        mode: Terminate
        certificateRefs:
          - name: team-a-apps-tls              # cert-manager, in THIS namespace — no ReferenceGrant needed
      allowedRoutes:
        namespaces:
          selector:
            matchLabels:
              kubernetes.io/metadata.name: team-a    # only team-a's workload namespace may attach
        kinds:
          - kind: HTTPRoute
          - kind: GRPCRoute
    - name: team-b
      protocol: HTTPS
      port: 443
      hostname: "*.team-b-amt.lan"
      tls:
        mode: Terminate
        certificateRefs:
          - name: team-b-apps-tls
      allowedRoutes:
        namespaces:
          selector:
            matchLabels:
              kubernetes.io/metadata.name: team-b
        kinds:
          - kind: HTTPRoute
          - kind: GRPCRoute
    - name: team-c
      protocol: HTTPS
      port: 443
      hostname: "*.team-c-amt.lan"
      tls:
        mode: Terminate
        certificateRefs:
          - name: team-c-apps-tls
      allowedRoutes:
        namespaces:
          selector:
            matchLabels:
              kubernetes.io/metadata.name: team-c
        kinds:
          - kind: HTTPRoute
          - kind: GRPCRoute
---
# Wildcard certificates for each team's subdomain, issued by the StepClusterIssuer that
# argocd-infra installs (step-issuer against step-ca). Wildcards are a reason step-issuer was
# chosen over ACME: HTTP-01 cannot issue them at all.
# Platform-owned: they live in the gateway namespace, not the team's.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: team-a-apps-tls
  namespace: tenant-gateway
spec:
  secretName: team-a-apps-tls
  dnsNames: ["*.team-a-amt.lan"]
  issuerRef:
    name: step-ca
    kind: StepClusterIssuer
    group: certmanager.step.sm
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: team-b-apps-tls
  namespace: tenant-gateway
spec:
  secretName: team-b-apps-tls
  dnsNames: ["*.team-b-amt.lan"]
  issuerRef:
    name: step-ca
    kind: StepClusterIssuer
    group: certmanager.step.sm
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: team-c-apps-tls
  namespace: tenant-gateway
spec:
  secretName: team-c-apps-tls
  dnsNames: ["*.team-c-amt.lan"]
  issuerRef:
    name: step-ca
    kind: StepClusterIssuer
    group: certmanager.step.sm
