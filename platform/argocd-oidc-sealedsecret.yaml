# The argocd OIDC client secret, on the ARGO CD side — the second sealing of the same plaintext
# held in infra/identity/oidc-client-sealedsecrets.yaml, for the OTHER namespace (guardrail 32).
#
# This one lives under platform/ rather than infra/ because it lands in `argocd-multitenant`, and
# that namespace belongs to the multi-tenant instance (guardrail 17). argocd-infra never writes
# here; platform-root does.
#
# `app.kubernetes.io/part-of: argocd` is REQUIRED for Argo CD to resolve
# `$argocd-oidc:clientSecret` from spec.oidcConfig in install/argocd-cr.yaml.
#
# Not added to `argocd-secret`, which is operator-managed and reverted on reconcile (guardrail 15).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc
  namespace: argocd-multitenant
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: argocd
      name: argocd-oidc
      namespace: argocd-multitenant
