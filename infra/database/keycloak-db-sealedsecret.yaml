# Keycloak's database owner credentials, consumed by bootstrap.initdb.secret on the CNPG
# Cluster in keycloak-postgres.yaml. Sealed strict-scope for the `keycloak` namespace.
#
# type: kubernetes.io/basic-auth with `username`/`password` is what CNPG expects — a plain
# Opaque secret is silently ignored and the cluster bootstraps with a generated password instead.
#
# Wave 6: before the Cluster at wave 7.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-db-credentials
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '6'
spec:
  encryptedData:
    password: 
    username: 
  template:
    metadata:
      name: keycloak-db-credentials
      namespace: keycloak
    type: kubernetes.io/basic-auth
