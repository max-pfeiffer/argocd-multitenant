# The issuer every certificate in this cluster resolves back to: both control-plane gateways,
# the Keycloak gateway, and the per-team tenant listeners.
#
# Cluster-scoped on purpose — certificates are requested from four different namespaces
# (argocd-multitenant, argocd-infra, keycloak, tenant-gateway) and a namespaced StepIssuer would
# need duplicating into each.
#
# THREE VALUES COME FROM THE CA BOOTSTRAP, not from thin air. All three are produced by the
# procedure in infra/pki/step-ca-secrets.md when the CA is created:
#   caBundle  - base64 of root_ca.crt (public; safe to commit)
#   kid       - the JWK provisioner's key ID (public; safe to commit)
#   password  - the provisioner password, delivered as a SealedSecret (never committed plain)
#
# The kid is a thumbprint of the provisioner's public key, so recreating the provisioner changes
# it. If issuance suddenly fails after a CA rebuild, check the kid before anything else.
apiVersion: certmanager.step.sm/v1beta1
kind: StepClusterIssuer
metadata:
  name: step-ca
  annotations:
    argocd.argoproj.io/sync-wave: "5"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  url: https://step-certificates.step-ca.svc.cluster.local
  caBundle: 
  provisioner:
    name: admin@amt.lan
    kid: sHf0TIiRnkZuRCUPB_WigEGNM3Pzp_1jw9vHyaT4XKY
    passwordRef:
      name: step-certificates-provisioner-password
      namespace: step-ca
      key: password
