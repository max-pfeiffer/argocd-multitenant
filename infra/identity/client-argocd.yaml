# OIDC client for the MULTI-TENANT ArgoCD instance.
apiVersion: v1.edp.epam.com/v1        # KeycloakClient/KeycloakRealmGroup are v1 (cluster kinds are v1alpha1)
kind: KeycloakClient
metadata:
  name: argocd
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "9"
spec:
  realmRef:
    name: platform
    kind: ClusterKeycloakRealm
  clientId: argocd
  public: false
  # Format is `$secretName:secretKey` — NOT a bare secret name (v1.35.0 CRD). Omit the field
  # entirely and the operator generates a secret named keycloak-client-<metadata.name>-secret;
  # we supply our own so the same value can be sealed for the Argo CD namespace too (guardrail 32).
  secret: $argocd-oidc-client-secret:clientSecret
  webUrl: https://argocd-amt.lan
  redirectUris:
    - https://argocd-amt.lan/auth/callback
  directAccess: false
  # THE ONE THAT WASTES AN AFTERNOON: Argo CD's scopes: "[groups]" needs a groups claim in the
  # ID token, and Keycloak does not emit one by default. Without this mapper, login succeeds, the
  # token carries no groups, every policy line fails to match, and defaultPolicy: "" denies
  # everything — which reads exactly like broken RBAC.
  protocolMappers:
    - name: groups
      protocol: openid-connect
      protocolMapper: oidc-group-membership-mapper
      config:
        "claim.name": groups
        "full.path": "false"
        "id.token.claim": "true"
        "access.token.claim": "true"
        "userinfo.token.claim": "true"
