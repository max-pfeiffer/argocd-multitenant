# The argocd-infra OIDC client secret, on the ARGO CD side — the second sealing of the same
# plaintext held in infra/identity/oidc-client-sealedsecrets.yaml (guardrail 32).
#
# `app.kubernetes.io/part-of: argocd` is REQUIRED: it is how Argo CD finds the secret when
# resolving `$argocd-infra-oidc:clientSecret` from spec.oidcConfig. Without the label the lookup
# fails and SSO breaks in a way that looks like an issuer problem.
#
# It is a separate Secret from `argocd-secret` on purpose — that one is operator-managed and
# hand-added keys are reverted on the next reconcile (guardrail 15).
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-infra-oidc
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: '9'
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: argocd
      name: argocd-infra-oidc
      namespace: argocd-infra
