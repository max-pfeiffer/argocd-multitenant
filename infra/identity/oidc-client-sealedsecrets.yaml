# The OIDC client secrets, on the KEYCLOAK side. Referenced by the EDP KeycloakClient CRs as
# `$<secret-name>:clientSecret`, which is why the key is `clientSecret` and not `secret`.
#
# THE SAME PLAINTEXT IS SEALED TWICE (guardrail 32) — once here for the `keycloak` namespace and
# once for the Argo CD namespace that consumes it (argocd-infra-oidc-sealedsecret.yaml here, and
# platform/argocd-oidc-sealedsecret.yaml for the multi-tenant instance). A strict-scoped
# SealedSecret cannot be unsealed under a different namespace, and that is the point: it is what
# stops sealed material being lifted into someone else's namespace. Rotating a client secret
# therefore means re-sealing BOTH copies from one plaintext.
#
# Wave 8: before the KeycloakClient CRs at wave 9.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-oidc-client-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '8'
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      name: argocd-oidc-client-secret
      namespace: keycloak
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: argocd-infra-oidc-client-secret
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: '8'
spec:
  encryptedData:
    clientSecret: 
  template:
    metadata:
      name: argocd-infra-oidc-client-secret
      namespace: keycloak
