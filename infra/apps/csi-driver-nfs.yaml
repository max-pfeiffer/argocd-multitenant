apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: infra
  source:
    # The `master` in this URL is only where the chart INDEX is served from; targetRevision
    # still selects an immutable chart version, so this is acceptable under guardrail 13.
    repoURL: https://raw.githubusercontent.com/kubernetes-csi/csi-driver-nfs/master/charts
    chart: csi-driver-nfs
    targetRevision: 4.13.4
    helm:
      valuesObject:
        externalSnapshotter:
          enabled: true
        controller:
          runOnControlPlane: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # namespaces come from infra/namespaces.yaml, with PSA labels
