apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudnative-pg
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: infra
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg
    targetRevision: 0.27.1
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # namespaces come from infra/namespaces.yaml, with PSA labels
      # REQUIRED, not a preference. Client-side apply stores the whole object in the
      # kubectl.kubernetes.io/last-applied-configuration annotation, and this chart's CRDs are
      # far larger than the 256 KiB an annotation can hold:
      #   CustomResourceDefinition "poolers.postgresql.cnpg.io" is invalid:
      #   metadata.annotations: Too long: may not be more than 262144 bytes
      # The operator install hits the same wall for the same reason (see CLAUDE.md).
      - ServerSideApply=true
