apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: infra
  source:
    repoURL: https://github.com/bitnami-labs/sealed-secrets
    # A GIT source, so targetRevision is a RELEASE TAG, not a chart version (guardrail 13).
    # The repo tags releases `v<controller-version>`; the chart version inside is a separate
    # 2.x series and is NOT a valid ref. v0.39.1 carries chart 2.19.2 / appVersion 0.39.0.
    # Keep the kubeseal CLI on the matching release when re-sealing.
    targetRevision: v0.39.1
    path: helm/sealed-secrets
    helm:
      values: |
        fullnameOverride: sealed-secrets-controller
  destination:
    server: https://kubernetes.default.svc
    namespace: sealed-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # namespaces come from infra/namespaces.yaml, with PSA labels
