# The Keycloak server itself. Not an Application — a Keycloak CR reconciled by the operator
# installed at wave 6. Needs its database (wave 7) and a certificate (wave 4).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: keycloak-tls
  dnsNames: ["keycloak-amt.lan"]
  issuerRef:
    name: step-ca
    kind: StepClusterIssuer
    group: certmanager.step.sm
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: platform-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  hostname:
    hostname: https://keycloak-amt.lan
  http:
    tlsSecret: keycloak-tls
  ingress:
    enabled: false            # exposure is via Gateway API, below
  db:
    vendor: postgres
    host: keycloak-db-rw      # the CNPG Cluster's read-write service
    database: keycloak
    # NOT `keycloak-db-app`. CNPG only generates a `<cluster>-app` secret when it invents the
    # credentials itself; because the Cluster supplies bootstrap.initdb.secret, the sealed
    # secret in infra/database/keycloak-db-sealedsecret.yaml IS the application credential and
    # no -app secret is ever created. Pointing at one yields
    #   CreateContainerConfigError: secret "keycloak-db-app" not found
    usernameSecret:
      name: keycloak-db-credentials
      key: username
    passwordSecret:
      name: keycloak-db-credentials
      key: password
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Pinned with Gateway API's own `addresses` field, NOT an annotation. Cilium propagates no
  # annotations from a Gateway onto the LoadBalancer Service it generates, so
  # `io.cilium/lb-ipam-ips` here is silently inert and LB-IPAM hands out whatever is free — which
  # shuffles addresses under the DNS records on any re-create. Verify with:
  #   kubectl get gateway -A -o custom-columns=NAME:.metadata.name,ADDR:.status.addresses[*].value
  addresses:
    - type: IPAddress
      value: "192.168.20.248"
  gatewayClassName: cilium
  listeners:
    - name: keycloak-tls
      protocol: TLS
      port: 443
      hostname: keycloak-amt.lan
      tls:
        mode: Passthrough      # Keycloak terminates with keycloak-tls, same shape as both ArgoCDs
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1         # TLSRoute is v1 as of Gateway API v1.6.x
kind: TLSRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: keycloak
      sectionName: keycloak-tls
  hostnames:
    - keycloak-amt.lan
  rules:
    - backendRefs:
        - name: platform-keycloak-service
          port: 8443
