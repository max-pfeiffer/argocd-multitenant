# The Keycloak server itself. Not an Application — a Keycloak CR reconciled by the operator
# installed at wave 6. Needs its database (wave 7) and a certificate (wave 4).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak-tls
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  secretName: keycloak-tls
  dnsNames: ["keycloak-amt.lan"]
  issuerRef:
    name: step-ca
    kind: StepClusterIssuer
    group: certmanager.step.sm
---
apiVersion: k8s.keycloak.org/v2alpha1
kind: Keycloak
metadata:
  name: platform-keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  instances: 1
  hostname:
    hostname: https://keycloak-amt.lan
  http:
    tlsSecret: keycloak-tls
  ingress:
    enabled: false            # exposure is via Gateway API, below
  db:
    vendor: postgres
    host: keycloak-db-rw      # the CNPG Cluster's read-write service
    database: keycloak
    usernameSecret:
      name: keycloak-db-app   # CNPG generates this secret for the `keycloak` owner
      key: username
    passwordSecret:
      name: keycloak-db-app
      key: password
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    io.cilium/lb-ipam-ips: "192.168.20.248"
spec:
  gatewayClassName: cilium
  listeners:
    - name: keycloak-tls
      protocol: TLS
      port: 443
      hostname: keycloak-amt.lan
      tls:
        mode: Passthrough      # Keycloak terminates with keycloak-tls, same shape as both ArgoCDs
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: TLSRoute
---
apiVersion: gateway.networking.k8s.io/v1         # TLSRoute is v1 as of Gateway API v1.6.x
kind: TLSRoute
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "8"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: keycloak
      sectionName: keycloak-tls
  hostnames:
    - keycloak-amt.lan
  rules:
    - backendRefs:
        - name: platform-keycloak-service
          port: 8443
