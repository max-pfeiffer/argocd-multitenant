apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: edp-keycloak-operator
  namespace: argocd-infra
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: infra
  source:
    repoURL: https://epam.github.io/edp-helm-charts/stable
    chart: keycloak-operator
    targetRevision: 1.35.0        # chart version == appVersion. infra/identity/ is written
                                  # against THIS version's CRDs — ClusterKeycloak and
                                  # ClusterKeycloakRealm are v1alpha1, KeycloakClient and
                                  # KeycloakRealmGroup are v1. Re-validate on any bump.
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false     # namespaces come from infra/namespaces.yaml, with PSA labels
