# HTTP-01 challenge endpoint for the step-ca ACME ClusterIssuer.
#
# WHY THIS EXISTS: the obvious thing is to solve challenges on the tenant gateway. That gateway is
# owned by the OTHER ArgoCD instance and created later in the bootstrap, so pointing at it would
# (a) make wave 4 unsatisfiable on a fresh cluster and (b) give the infrastructure instance a hard
# dependency on a multi-tenant object, which is exactly the coupling guardrail 29 rules out.
# A dedicated solver gateway in this instance keeps the wall intact.
#
# It listens on plain HTTP by design: ACME HTTP-01 challenges are unauthenticated by definition
# and carry no secret. Nothing else may attach — allowedRoutes is pinned to cert-manager.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: acme-solver
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    io.cilium/lb-ipam-ips: "192.168.20.249"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
        kinds:
          - kind: HTTPRoute
